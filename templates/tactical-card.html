<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>战术分析卡母版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1440px;overflow:hidden;background:#FBFBFD;color:#1A2B4C;font-family:Inter,"PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
.artboard{position:relative;width:1080px;height:1440px;overflow:hidden;background:radial-gradient(circle at 1px 1px,#DEE6F4 1px,transparent 1.2px) 0 0/26px 26px,#FBFBFD}
.pad{position:relative;z-index:3;height:100%;padding:50px 68px 42px 72px;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid VARACCENT;padding-bottom:14px}
.tg{font-size:16px;letter-spacing:.28em;color:VARACCENT;font-weight:800}
.pager{font-size:17px;letter-spacing:.14em;color:VARACCENT;font-weight:700}
.title{font-size:42px;font-weight:800;margin-top:22px;color:#1A2B4C;line-height:1.15}
.title em{font-style:normal;color:VARACCENT}
.sub{font-size:20px;color:#8FA3C8;margin-top:8px;font-weight:600}
.chartbox{flex:1;margin-top:20px;background:#fff;border:1px solid #C3CEE8;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px}
.chart{width:100%;height:100%;display:block}
.note{margin-top:18px;font-size:22px;line-height:1.7;color:#3a4658;border-left:3px solid VARACCENT;padding-left:16px}
.insight{margin-top:16px;border:1px solid #C3CEE8;border-left:4px solid VARACCENT;padding:16px 22px;background:#fff}
.insight .t{font-size:18px;color:VARACCENT;font-weight:800}
.insight .d{font-size:26px;color:#1A2B4C;font-weight:700;margin-top:6px;line-height:1.5}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;border-top:2px solid VARACCENT;padding-top:15px}
.foot .b{font-size:17px;letter-spacing:.30em;color:#1A2B4C;font-weight:800}
.foot .h{font-size:17px;color:#1A2B4C;font-weight:600}
.foot-owl{width:38px;height:38px;vertical-align:middle;margin-right:8px}
</style></head><body>
<div class="artboard"><div class="pad">
  <div class="topbar"><div class="tg">DATA · TINY TYPE</div><div class="pager">0X / 04</div></div>
  <div class="title">标题<em>强调</em></div>
  <div class="sub">副题 · 说明</div>
  <div class="chartbox"><!-- 嵌入足球图型：(SVG) 按数据形状选择 --></div>
  <p class="note">一句解读。</p>
  <div class="insight"><div class="t">关键结论</div><div class="d">结论。</div></div>
  <div class="foot"><span class="b"><img class="foot-owl" src="ip-owl.png" alt="">BAWBAW</span><span class="h">@bawbaw</span></div>
</div></div></body></html>
